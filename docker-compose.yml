# Integration tests run against a real Postgres, never a mocked Supabase.
#
# RLS policies, pgroonga's Korean tokenization and the Entry triggers *are*
# the behaviour under test, and all three are invisible to a mock.
#
# The image carries pgvector and pg_trgm, the two extensions the app depends on.
#
# Deliberately *not* Supabase's image, which also has pgroonga: the app is meant
# to run on any Postgres with pgvector (ADR-0003), so developing against a
# database with more than production has is how you find out too late that you
# used something that is not there.
services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_PASSWORD: yaongi
      # Deliberately no POSTGRES_DB. This image's entrypoint creates that
      # database as `supabase_admin` (a superuser this compose file has no
      # password for), leaving `postgres` — the role the tests connect as —
      # unable to so much as CREATE TABLE in it. The stock `postgres` database
      # is owned by `postgres`, so migrations apply as they would on hosted
      # Supabase. The container is disposable either way.
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 45
    tmpfs:
      # Tests only — the database is disposable, so keep it off disk and fast.
      - /var/lib/postgresql/data
